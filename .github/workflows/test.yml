name: Test

# Only master on push: any other branch is covered by pull_request, and
# listening to both made every PR from a branch in this repo run twice.
on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
    - name: Get latest code
      uses: actions/checkout@v4

    - name: Install Node.js and NPM
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    # --ignore-scripts keeps dependency lifecycle scripts from executing on CI.
    # Nothing here needs them: esbuild resolves its binary from the platform
    # package, fsevents is optional and macOS-only, and core-js only prints a
    # funding banner.
    - run: npm ci --ignore-scripts
    - run: npm test
    - run: npm run build
